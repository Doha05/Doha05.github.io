<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 모드 | 전체 제어 패널</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Jua', sans-serif; background-color: #FFF0F5; color: #5A4B4D; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 40px 0; }
        
        #login-box { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 8px 20px rgba(255, 182, 193, 0.3); text-align: center; }
        #login-box input { width: 80%; padding: 15px; font-size: 16px; border: 2px solid #FFB6C1; border-radius: 15px; font-family: 'Jua', sans-serif; margin-bottom: 15px; outline: none; }
        
        #dashboard { display: none; background: white; padding: 40px; border-radius: 30px; width: 800px; box-shadow: 0 8px 20px rgba(255, 182, 193, 0.3); }
        h2 { color: #FFB6C1; border-bottom: 2px dashed #FFB6C1; padding-bottom: 10px; margin-top: 30px; }
        
        .category-title { background-color: #FFB6C1; color: white; padding: 10px 20px; border-radius: 15px; display: inline-block; margin-top: 30px; margin-bottom: 10px; }
        
        .edit-group { margin-bottom: 15px; text-align: left; background-color: #FFF9FA; padding: 15px; border-radius: 15px; border: 1px solid #FFE4E1; }
        .edit-group label { display: block; margin-bottom: 8px; font-size: 18px; color: #8B7377; }
        .edit-group input, .edit-group textarea { width: 95%; padding: 10px; border: 1px solid #ddd; border-radius: 10px; font-family: 'Jua', sans-serif; font-size: 14px; }
        
        button { background-color: #FFB6C1; color: white; border: none; padding: 15px 30px; border-radius: 20px; font-family: 'Jua', sans-serif; font-size: 18px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #FF9AA2; transform: scale(1.05); }
        .save-btn { background-color: #FFD700; color: #5A4B4D; width: 100%; margin-top: 30px; font-size: 22px; padding: 20px; }

        /* 회원 관리 테이블 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #FFE4E1; padding: 12px; text-align: center; }
        th { background-color: #FFB6C1; color: white; }
        .delete-btn { background-color: #ff4d4d; color: white; padding: 5px 10px; border-radius: 5px; font-size: 14px; margin: 0; }
        .delete-btn:hover { background-color: #cc0000; transform: none; }
    </style>
</head>
<body>

    <div id="login-box">
        <h2 style="border:none; margin-top:0;">🔒 도하 스튜디오 전체 관리자</h2>
        <input type="text" id="id-input" placeholder="관리자 아이디 (doha)">
        <br>
        <input type="password" id="pw-input" placeholder="비밀번호 (0706)">
        <br>
        <button onclick="checkLogin()">접속하기</button>
    </div>

    <div id="dashboard">
        <h2 style="margin-top:0;">🛠️ 도하 관리자 패널</h2>

        <div class="category-title">👥 회원 관리 시스템</div>
        <div class="edit-group">
            <p style="margin-top:0; color:gray; font-size:14px;">가입한 회원 목록입니다. 문제 발생 시 탈퇴(삭제)시킬 수 있습니다.</p>
            <table>
                <thead>
                    <tr>
                        <th>아이디</th>
                        <th>계좌정보</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="member-table-body">
                    <!-- 자바스크립트로 회원 목록 렌더링 -->
                </tbody>
            </table>
        </div>

        <div class="category-title">1. 헤더 & 로고</div>
        <div class="edit-group">
            <label>🐥 좌측 상단 로고 (이모지 포함)</label>
            <input type="text" value="🐥 도하 스튜디오">
        </div>

        <div class="category-title">2. 메인 히어로 섹션</div>
        <div class="edit-group">
            <label>📝 메인 큰 제목</label>
            <textarea rows="2">나만의 특별한 홈페이지를 만들고 싶으신가요?</textarea>
        </div>
        <div class="edit-group">
            <label>📝 메인 서브 설명글</label>
            <textarea rows="3">포트폴리오, 미니 홈페이지, 카페 등! 귀엽고 아기자기한 디자인과 합리적인 가격으로 나만의 공간을 만들어보세요.</textarea>
        </div>

        <div class="category-title">3. 특징 소개 (3가지)</div>
        <div class="edit-group">
            <label>🚀 특징 1 (아이콘 / 제목 / 내용)</label>
            <input type="text" value="🚀" style="width: 50px; margin-bottom:5px;">
            <input type="text" value="빠른 제작" style="margin-bottom:5px;">
            <input type="text" value="AI 기술을 활용해 원하시는 디자인을 빠르게 완성해 드립니다.">
        </div>
        <div class="edit-group">
            <label>🎨 특징 2</label>
            <input type="text" value="🎨" style="width: 50px; margin-bottom:5px;">
            <input type="text" value="맞춤형 디자인" style="margin-bottom:5px;">
            <input type="text" value="피드백을 수용해 원하시는 결과물이 나올 때까지 수정해드립니다.">
        </div>

        <div class="category-title">4. 가격 안내 섹션</div>
        <div class="edit-group">
            <label>💰 요금제 1 (제목 / 가격)</label>
            <input type="text" value="상세페이지 추가" style="margin-bottom:5px;">
            <input type="text" value="2,000원">
        </div>
        <div class="edit-group">
            <label>💰 요금제 2 - 인기 (제목 / 가격)</label>
            <input type="text" value="템플릿 커스텀" style="margin-bottom:5px;">
            <input type="text" value="50,000원">
        </div>

        <div class="category-title">5. 푸터 (하단)</div>
        <div class="edit-group">
            <label>©️ 하단 저작권 및 안내 문구</label>
            <textarea rows="2">ⓒ 2026 도하 스튜디오. All rights reserved. 당신의 상상을 현실로 만들어드립니다.</textarea>
        </div>

        <button class="save-btn" onclick="alert('모든 수정 사항이 서버 DB에 저장되었습니다! 🚀')">💾 홈페이지 전체 업데이트 적용하기</button>
    </div>

    <script>
        function checkLogin() {
            const id = document.getElementById('id-input').value;
            const pw = document.getElementById('pw-input').value;
            
            // 데이터베이스에서 관리자 계정 확인
            let users = JSON.parse(localStorage.getItem('db_users')) || [];
            let adminUser = users.find(u => u.id === 'doha');

            if(id === 'doha' && pw === (adminUser ? adminUser.pw : '0706')) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                renderMembers();
            } else {
                alert('아이디 또는 비밀번호가 틀렸습니다!');
            }
        }

        function renderMembers() {
            let users = JSON.parse(localStorage.getItem('db_users')) || [];
            const tbody = document.getElementById('member-table-body');
            tbody.innerHTML = '';

            users.forEach(user => {
                // 관리자 계정은 삭제 버튼을 숨김
                let deleteHtml = user.id === 'doha' 
                    ? '<span style="color:gray; font-size:12px;">최고관리자</span>' 
                    : `<button class="delete-btn" onclick="deleteMember('${user.id}')">강제탈퇴</button>`;

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:bold;">${user.id}</td>
                        <td>${user.account || '미입력'}</td>
                        <td>${deleteHtml}</td>
                    </tr>
                `;
            });
        }

        function deleteMember(targetId) {
            if(!confirm(`정말로 회원 [${targetId}]님을 탈퇴시키겠습니까?`)) return;

            let users = JSON.parse(localStorage.getItem('db_users'));
            // 타겟 유저를 제외하고 배열 재구성
            users = users.filter(user => user.id !== targetId);
            localStorage.setItem('db_users', JSON.stringify(users));

            // 해당 유저의 채팅 기록도 삭제 처리 (옵션)
            let chats = JSON.parse(localStorage.getItem('db_chats'));
            if(chats[targetId]) {
                delete chats[targetId];
                localStorage.setItem('db_chats', JSON.stringify(chats));
            }

            alert('회원 탈퇴 처리가 완료되었습니다.');
            renderMembers(); // 테이블 새로고침
        }
    </script>
</body>
</html>
