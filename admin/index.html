<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 모드 | 전체 제어 패널</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Jua', sans-serif; background-color: #FFF0F5; color: #5A4B4D; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 40px 10px; overflow-x: hidden; }
        
        #login-box { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 8px 20px rgba(255, 182, 193, 0.3); text-align: center; width: 100%; max-width: 400px; }
        #login-box input { width: 100%; padding: 15px; font-size: 16px; border: 2px solid #FFB6C1; border-radius: 15px; font-family: 'Jua', sans-serif; margin-bottom: 15px; outline: none; }
        
        #dashboard { display: none; background: white; padding: 40px; border-radius: 30px; width: 100%; max-width: 850px; box-shadow: 0 8px 20px rgba(255, 182, 193, 0.3); }
        h2 { color: #FFB6C1; border-bottom: 2px dashed #FFB6C1; padding-bottom: 10px; margin-top: 0; }
        
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #FFE4E1; padding-bottom: 10px; flex-wrap: wrap; }
        .tab-btn { background: none; border: none; font-size: 16px; color: #8B7377; cursor: pointer; padding: 8px 12px; font-family: 'Jua', sans-serif; border-radius: 10px; flex-grow: 1; }
        .tab-btn.active { background: #FFB6C1; color: white; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .category-title { background-color: #FFB6C1; color: white; padding: 10px 20px; border-radius: 15px; display: inline-block; margin-top: 20px; margin-bottom: 10px; }
        .edit-group { margin-bottom: 15px; text-align: left; background-color: #FFF9FA; padding: 15px; border-radius: 15px; border: 1px solid #FFE4E1; }
        .edit-group label { display: block; margin-bottom: 8px; font-size: 18px; color: #8B7377; }
        .edit-group input, .edit-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 10px; font-family: 'Jua', sans-serif; font-size: 14px; margin-bottom: 5px;}
        
        button { background-color: #FFB6C1; color: white; border: none; padding: 10px 20px; border-radius: 15px; font-family: 'Jua', sans-serif; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #FF9AA2; transform: scale(1.05); }
        .save-btn { background-color: #FFD700; color: #5A4B4D; width: 100%; margin-top: 30px; font-size: 20px; padding: 15px; }

        /* 테이블 모바일 스크롤 처리를 위한 래퍼 추가 */
        .table-wrapper { width: 100%; overflow-x: auto; margin-top: 10px; }
        table { width: 100%; min-width: 500px; border-collapse: collapse; font-size: 15px; }
        th, td { border: 1px solid #FFE4E1; padding: 10px; text-align: center; white-space: nowrap; }
        th { background-color: #FFB6C1; color: white; }
        .delete-btn { background-color: #ff4d4d; color: white; padding: 5px 10px; font-size: 14px; margin: 0; }
        .status-checkbox { transform: scale(1.3); cursor: pointer; }

        @media (max-width: 768px) {
            #dashboard { padding: 20px; }
            h2 { font-size: 20px; }
            .category-title { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div id="login-box">
        <h2 style="border:none;">🔒 도하 스튜디오 최고 관리자</h2>
        <input type="text" id="id-input" placeholder="아이디를 입력하세요">
        <br>
        <input type="password" id="pw-input" placeholder="비밀번호를 입력하세요">
        <br>
        <button onclick="checkLogin()">접속하기</button>
    </div>

    <div id="dashboard">
        <h2>🛠️ 도하 관리자 패널</h2>
        
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('tab-main')">메인페이지 관리</button>
            <button class="tab-btn" onclick="switchTab('tab-detail')">상세페이지 관리</button>
            <button class="tab-btn" onclick="switchTab('tab-member')">회원 관리 (권한설정)</button>
        </div>

        <div id="tab-main" class="tab-content active">
            <div class="edit-group">
                <label>🐥 좌측 상단 로고 (이모지 포함)</label>
                <input type="text" id="cfg-logo" value="🐥 도하 스튜디오">
            </div>
            <div class="edit-group">
                <label>📝 메인 큰 제목</label>
                <textarea id="cfg-title" rows="2">나만의 특별한 홈페이지를 만들고 싶으신가요?</textarea>
            </div>
            <div class="edit-group">
                <label>📝 메인 서브 설명글</label>
                <textarea id="cfg-desc" rows="3">포트폴리오, 미니 홈페이지, 카페 등! 귀엽고 아기자기한 디자인과 합리적인 가격으로 나만의 공간을 만들어보세요.</textarea>
            </div>
            <button class="save-btn" onclick="saveConfig()">💾 메인페이지 수정 적용하기</button>
        </div>

        <div id="tab-detail" class="tab-content">
            <p style="color:gray; font-size:14px; margin:0;">※ 주의: 이곳에서 '이동할 주소'를 바꿔도 깃허브 폴더 이름은 직접 깃허브 사이트에서 변경하셔야 합니다!</p>
            
            <div class="category-title">템플릿 1 (카페/디저트)</div>
            <div class="edit-group">
                <input type="text" id="tpl-url-1" placeholder="이동할 주소 (예: /template/)">
                <input type="text" id="tpl-title-1" placeholder="제목 (예: 🍰 카페/디저트 템플릿)">
                <input type="text" id="tpl-img-1" placeholder="배경 이미지 URL">
            </div>
            
            <div class="category-title">템플릿 2 (포트폴리오)</div>
            <div class="edit-group">
                <input type="text" id="tpl-url-2" placeholder="이동할 주소 (예: /portfolio/)">
                <input type="text" id="tpl-title-2" placeholder="제목 (예: 🎨 개인 포트폴리오)">
                <input type="text" id="tpl-img-2" placeholder="배경 이미지 URL">
            </div>
            
            <button class="save-btn" onclick="saveTemplates()">💾 상세페이지 연결 수정하기</button>
        </div>

        <div id="tab-member" class="tab-content">
            <p style="color:#ff8b94; font-size:14px; font-weight:bold; margin-top:0;">※ '완료' 상태로 체크된 고객님만 메인 홈페이지에서 리뷰를 작성할 수 있습니다.</p>
            <div class="edit-group">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>아이디</th>
                                <th>닉네임</th>
                                <th>연락처</th>
                                <th>상태(리뷰권한)</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="member-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            if(tabId === 'tab-member') renderMembers();
        }

        function checkLogin() {
            const id = document.getElementById('id-input').value;
            const pw = document.getElementById('pw-input').value;
            let users = JSON.parse(localStorage.getItem('db_users')) || [];
            let adminUser = users.find(u => u.id === 'doha');

            if(id === 'doha' && pw === (adminUser ? adminUser.pw : '0706')) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadAdminData();
            } else {
                alert('접근 거부!');
            }
        }

        function loadAdminData() {
            let config = JSON.parse(localStorage.getItem('db_config')) || { logo: '🐥 도하 스튜디오', mainTitle: '나만의 특별한 홈페이지를\n만들고 싶으신가요?', mainDesc: '포트폴리오, 미니 홈페이지, 카페 등! 귀엽고 아기자기한 디자인과 합리적인 가격으로 나만의 공간을 만들어보세요.' };
            document.getElementById('cfg-logo').value = config.logo;
            document.getElementById('cfg-title').value = config.mainTitle;
            document.getElementById('cfg-desc').value = config.mainDesc;

            let tpls = JSON.parse(localStorage.getItem('db_templates')) || [
                { url: '/template/', img: 'https://images.unsplash.com/photo-1551024601-bec78aea704b?q=80&w=400', title: '🍰 카페/디저트 템플릿' },
                { url: '/template/', img: 'https://images.unsplash.com/photo-1513364776144-60967b0f800f?q=80&w=400', title: '🎨 개인 포트폴리오' }
            ];
            document.getElementById('tpl-url-1').value = tpls[0].url; document.getElementById('tpl-title-1').value = tpls[0].title; document.getElementById('tpl-img-1').value = tpls[0].img;
            document.getElementById('tpl-url-2').value = tpls[1].url; document.getElementById('tpl-title-2').value = tpls[1].title; document.getElementById('tpl-img-2').value = tpls[1].img;
        }

        function saveConfig() {
            let config = { logo: document.getElementById('cfg-logo').value, mainTitle: document.getElementById('cfg-title').value, mainDesc: document.getElementById('cfg-desc').value };
            localStorage.setItem('db_config', JSON.stringify(config));
            alert('메인페이지 설정이 저장되었습니다!');
        }

        function saveTemplates() {
            let tpls = [
                { url: document.getElementById('tpl-url-1').value, title: document.getElementById('tpl-title-1').value, img: document.getElementById('tpl-img-1').value },
                { url: document.getElementById('tpl-url-2').value, title: document.getElementById('tpl-title-2').value, img: document.getElementById('tpl-img-2').value }
            ];
            localStorage.setItem('db_templates', JSON.stringify(tpls));
            alert('상세페이지 연결 정보가 저장되었습니다!');
        }

        function renderMembers() {
            let users = JSON.parse(localStorage.getItem('db_users')) || [];
            const tbody = document.getElementById('member-table-body');
            tbody.innerHTML = '';
            users.forEach(user => {
                let deleteHtml = user.id === 'doha' ? '<span style="color:gray;">최고관리자</span>' : `<button class="delete-btn" onclick="deleteMember('${user.id}')">탈퇴</button>`;
                let nick = user.nickname || '-';
                
                let statusHtml = '-';
                if(user.id !== 'doha') {
                    let isChecked = user.status === '완료' ? 'checked' : '';
                    statusHtml = `<label><input type="checkbox" class="status-checkbox" onchange="toggleUserStatus('${user.id}', this.checked)" ${isChecked}> 완료</label>`;
                }

                tbody.innerHTML += `<tr><td><b>${user.id}</b></td><td>${nick}</td><td>${user.messenger || '-'}</td><td>${statusHtml}</td><td>${deleteHtml}</td></tr>`;
            });
        }

        function toggleUserStatus(userId, isChecked) {
            let users = JSON.parse(localStorage.getItem('db_users')) || [];
            let userIndex = users.findIndex(u => u.id === userId);
            if(userIndex !== -1) {
                users[userIndex].status = isChecked ? '완료' : '진행중';
                localStorage.setItem('db_users', JSON.stringify(users));
            }
        }

        function deleteMember(targetId) {
            if(!confirm(`회원 [${targetId}]님을 강제 탈퇴시키겠습니까?`)) return;
            let users = JSON.parse(localStorage.getItem('db_users'));
            users = users.filter(user => user.id !== targetId);
            localStorage.setItem('db_users', JSON.stringify(users));
            renderMembers();
        }
    </script>
</body>
</html>
